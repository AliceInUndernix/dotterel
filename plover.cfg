# Plover's first settings (install.sh copies this, without these
# comment lines, to plover.cfg in PLOVER_DIR when there is none yet;
# Plover rewrites the file itself, so it is a copy, not a link).
[Machine Configuration]
machine_type = Gemini PR
auto_start = True

[Gemini PR]
port = /dev/ttyACM0

[System]
name = Dotterel

[Plugins]
enabled_extensions = ["plover_auto_reconnect_machine"]
